[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cplex-cvrp-portfolio"
version = "0.1.0"
description = "Portfolio-ready CVRP model using IBM DOcplex/CPLEX"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "docplex>=2.25,<3",
  "matplotlib>=3.7,<4"
]

[project.scripts]
cvrp-cplex = "cvrp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
